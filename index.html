(function(){ try{ var raw = localStorage.getItem('ft.ui.v1'), u = JSON.parse(raw || '{}'), th = u.theme || {}, m = th.mode || (raw ? 'dark' : 'auto');
  var look = m === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m; document.documentElement.setAttribute('data-theme', look); }catch(e){} })();
</script>
<script>
// Home Screen app on iPhone: size everything to the real screen (the reported viewport can be shorter, leaving a black strip at the bottom). In Safari nothing changes.
(function(){ var pwa = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); if(!pwa) return;
  var de = document.documentElement; de.classList.add('pwa');
  function fit(){ var portrait = innerHeight >= innerWidth, h = portrait ? Math.max(innerHeight, screen.height || 0) : innerHeight; de.style.setProperty('--appH', h + 'px'); }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', function(){ setTimeout(fit, 250); }); })();
</script>
