<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker</title>
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0f1113; --panel:#171a1d; --panel2:#1f2327; --line:#2a2f34;
  --text:#eef1f3; --muted:#8b949c; --accent:#c6f432; --accent-ink:#0f1113;
  --p:#5ab0ff; --c:#ffb547; --f:#ff6b8b; --danger:#ff5c5c; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 8px}
header .left{display:flex;align-items:center;gap:8px;min-width:0}
h1{font-size:22px;margin:0;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} h1 span{color:var(--accent)}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer;flex:0 0 42px}
.page.hide{display:none}
/* home */
.hello{color:var(--muted);margin:2px 0 18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:150px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-align:left;cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .e{font-size:36px;line-height:1}
.tile b{display:block;font-size:17px}
.tile small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tile.big{grid-column:1/-1;min-height:120px;flex-direction:row;align-items:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.big small{color:#3c4a12}
.tile.big .e{font-size:44px}
.tile.soon{opacity:.55}
.tile .badge{position:absolute;top:12px;right:12px;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
/* tabs + list */
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:6px 0 10px}
.tabs button{flex:1;border:0;border-radius:9px;padding:10px 6px;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px;margin:4px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:10px 2px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px}
.linkbtn b{color:var(--text)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.card:active{background:var(--panel2)}
.ficon{font-size:30px;width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;background:var(--panel2);border-radius:12px}
.ficon.none{font-size:20px;color:var(--muted)}
.body{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.brand{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:600;font-size:16px;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.kcal{font-weight:700;font-size:17px;white-space:nowrap} .kcal small{color:var(--muted);font-weight:400;font-size:12px}
.macros{display:flex;gap:12px;margin-top:6px;font-size:14px}
.m b{font-weight:700} .m.p b{color:var(--p)} .m.c b{color:var(--c)} .m.f b{color:var(--f)}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.raw{color:var(--c);border-color:#5a4520} .chip.cooked{color:var(--p);border-color:#1f4060} .chip.ok{color:var(--accent);border-color:#4a5a1a}
.empty{text-align:center;color:var(--muted);padding:44px 20px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{color:var(--text);display:block;font-size:17px;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:16px 28px;font-size:17px;font-weight:700;box-shadow:0 8px 30px rgba(198,244,50,.25);cursor:pointer;z-index:5;white-space:nowrap}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet.tall{height:92vh}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px;border:1px solid var(--line)}}
.sheet h2{margin:0 0 4px;font-size:19px}
.sheet h3{margin:18px 0 6px;font-size:15px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;font-size:15px}
.opt .ic{font-size:24px;width:32px;text-align:center} .opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer;min-width:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:6px} .hint.warn{color:var(--c)} .hint.click{cursor:pointer;text-decoration:underline dotted}
.typebtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;text-align:left;font-size:15px}
.typebtn .big{font-size:28px} .typebtn small{display:block;color:var(--muted);font-size:12px}
.typebtn.missing{border-color:var(--c)}
.brandrow{display:flex;gap:8px;align-items:center}
.toggle{flex:0 0 auto;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.toggle.on{background:var(--text);color:var(--bg);font-weight:600}
.packs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pack{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 10px;font-size:14px;background:var(--bg)}
.pack.usual{border-color:var(--accent)}
.pack button{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 6px;border-radius:999px}
.pack.usual .star{color:var(--accent)}
.preview{font-size:13px;color:var(--muted);margin-top:8px;padding:8px 10px;background:var(--panel2);border-radius:10px;display:none}
.preview.show{display:block} .preview b{color:var(--text)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{flex:0 0 auto;padding:11px 14px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
/* picker */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;font-size:12px;text-align:center}
.pitem .e{font-size:28px;line-height:1}
.pitem.on{border-color:var(--accent);background:#1d2410}
.pback{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0 10px}
/* scanner */
.cam{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;left:10%;right:10%;top:32%;bottom:32%;border:2px solid var(--accent);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:rgba(198,244,50,.8);animation:sweep 1.6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-28px)}50%{transform:translateY(28px)}}
.cam .torch{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.cam .torch.on{background:var(--accent);color:var(--accent-ink)}
.status{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:14px;display:none}
.status.show{display:block} .status.err{color:var(--danger)}
/* cook */
.irow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ipick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;cursor:pointer}
.ipick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipick.unset{border-color:var(--c);color:var(--c)}
.ipick small{display:block;color:var(--muted);font-size:11px}
.igr{flex:0 0 92px;position:relative}
.igr input{padding-right:26px;text-align:right}
.igr i{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-style:normal;font-size:13px}
.irm{flex:0 0 auto;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:6px}
.totals{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel2);font-size:14px;margin-top:4px}
.totals b{font-weight:700}
.recipe{background:var(--panel2);border-radius:var(--r);padding:12px 14px;margin-top:8px}
.recipe ol{margin:6px 0 0;padding-left:20px} .recipe li{margin:6px 0}
.recipe ul{margin:6px 0 0;padding-left:18px;color:var(--muted)} .recipe ul li{margin:3px 0}
.rmeta{color:var(--muted);font-size:13px}
.sres{display:flex;flex-direction:column;gap:6px}
.sgroup{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 4px}
.sitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.sitem .e{font-size:24px;width:30px;text-align:center}
.sitem .t{flex:1;min-width:0} .sitem .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{color:var(--muted);font-size:12px}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted);text-transform:none;letter-spacing:0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.bignum{font-size:28px;font-weight:800;letter-spacing:-.5px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;text-align:center}
.statrow div{background:var(--panel2);border-radius:12px;padding:10px 4px}
.statrow b{display:block;font-size:17px} .statrow small{color:var(--muted);font-size:11px}
/* language */
.langpick{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.langpick button{padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99999;display:flex;gap:14px;align-items:center;white-space:nowrap}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#3d6b00;font-weight:800;font-size:14px;cursor:pointer;padding:0}
.src{font-size:11px;color:var(--muted);margin-top:8px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.hide{display:none!important}
.ver{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
/* v1.4 */
:root{ --orange:#ff8a2a; --ok:#59d38c; }
.btn.back{width:100%;flex:1 1 100%;background:var(--orange);border-color:var(--orange);color:#1c0e00;font-size:17px;padding:16px}
.backpill{background:var(--orange);border:0;color:#1c0e00;font-weight:700;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.sheethead h2{margin:0}
.tile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;justify-content:flex-start}
.tile.wide .e{font-size:34px}
textarea.big{min-height:180px;font-size:15px;line-height:1.45}
.parsed li.miss{color:var(--c)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slot{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.slot.taken{background:#123622;border-color:var(--ok);color:var(--ok);font-weight:600}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.tchips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.progress{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.tag{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
/* 0.5.3 */
:root{ --kc:#c6f432; --fi:#59d38c; --na:#b388ff; --kk:#4dd0e1; }
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;background:rgba(23,26,29,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);padding:6px 0;border-radius:12px;cursor:pointer}
.tabbar span{font-size:22px;line-height:1} .tabbar b{font-size:12px;font-weight:600}
.tabbar button.on{color:var(--accent);background:#1d2410}
.fab{bottom:calc(84px + env(safe-area-inset-bottom))!important}
.toast{bottom:calc(150px + env(safe-area-inset-bottom))!important}
#pgToday [data-home]{display:none}
#gBackBtn{background:var(--orange);color:#1c0e00;border-color:var(--orange);font-weight:800;font-size:22px}
.sectitle{margin:4px 0 10px;font-size:20px}
.sback{float:left;width:40px;height:40px;margin:-6px 10px 6px -2px;border-radius:12px;background:var(--orange);color:#1c0e00;border:0;font-size:26px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(255,138,42,.3)}
.pback{background:var(--orange)!important;color:#1c0e00!important;font-weight:800;border-radius:999px;padding:8px 14px!important;margin-bottom:12px}
.hubrow{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-top:12px}
.minirec{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:10px 6px;color:var(--muted);cursor:pointer}
.minirec small{font-size:12px}
.hubrow .pettile{min-height:0;flex-direction:column;align-items:flex-start;gap:6px}
.dblocks{color:var(--muted);font-size:13px;text-align:center;margin:-4px 0 10px}
.daycard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.daycard.today{border-color:var(--accent)}
.dch{display:flex;gap:8px;align-items:baseline;margin-bottom:6px} .dch b{font-size:15px} .dch small{color:var(--muted)} .dch .chip{margin-left:auto}
.dcrow{display:flex;gap:6px;align-items:center;margin-top:6px} .dcrow select{flex:1} .dcrow input[type=time]{flex:0 0 104px;padding:8px} .dcl{width:22px;text-align:center}
.wrapseg{flex-wrap:wrap} .wrapseg button{flex:1 1 30%}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bigopt{padding:18px 16px} .bigopt b{font-size:17px}
.gbtn.wt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;border-left-width:1px} .gbtn.wt .e{font-size:30px}
.gbtn .dots{display:flex;gap:4px;margin:6px 0 2px} .gbtn .dots i{width:10px;height:10px;border-radius:50%}
.hchip i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hc);margin-right:6px}
.hchip.on{background:var(--hc);border-color:var(--hc);color:#111}
.eqchip{display:inline-flex;align-items:center;gap:5px;border-color:var(--ec)!important;color:var(--ec)}
.eqchip.on{background:var(--ec);color:#111} .eqchip.on svg{stroke:#111}
.eqhead{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;margin:14px 0 8px}
.extile{border-left:4px solid var(--eq)!important}
.extile .eqb{position:absolute;top:6px;left:8px}
.rc{flex:0 0 auto;padding:8px 9px;border-radius:9px;border:1px solid #6b3f12;background:#2a1a08;color:var(--orange);font-size:12px;font-weight:700;cursor:pointer}
.rc.ck{border-color:#1f4060;background:#0e1d2c;color:var(--p)}
.ipick.vague{border-color:#6b3f12} .ipick small{display:block;font-size:11px;color:var(--orange)}
.kcal{color:var(--kc)} .m.fi b{color:var(--fi)} .m.kc b{color:var(--kc)}
.mrow.fi .mbar i{background:var(--fi)} .mrow:not(.p):not(.c):not(.f):not(.fi) .mbar i{background:var(--kc)}
.elec{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);cursor:pointer}
.macroline{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:6px 0 10px;font-size:15px}
/* v1.7 */
.exc .exh{display:flex;gap:10px;align-items:center}

.restbar{position:sticky;bottom:0;background:#0b1a10;border:1px solid var(--ok);border-radius:14px;padding:10px 12px;margin:0 -4px calc(8px + env(safe-area-inset-bottom))}
.restbar .rbtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.restbar b{font-size:20px;color:var(--ok)} .restbar button{border:1px solid #2a5a3a;background:none;color:var(--text);border-radius:8px;padding:6px 10px;margin-left:6px;cursor:pointer}

.pct{font-weight:800;text-align:right} .pct.up{color:var(--ok)} .pct.down{color:var(--danger)} .pct.flat{color:var(--muted)}
.petart svg{display:block}
.pettile{min-height:110px} .pettile .petart{flex:0 0 76px}
.ppcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;margin-bottom:10px}

.petbig{display:flex;justify-content:center;margin:6px 0}
.feed li{margin:6px 0} .feed .ok{color:var(--ok)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:100000;overflow:hidden}

@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot));opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.petart svg .bob,.petbig svg .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:center}
/* v1.5 */
.mbar{display:block;height:6px;background:var(--panel2);border-radius:999px;overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s}
.tile.big .mbar{background:rgba(0,0,0,.15)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.daynav b{font-size:16px;text-align:center;flex:1}
.macrocard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:12px}

.sect{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px;font-size:15px}

.win.gym{background:#1d2410;border-color:#4a5a1a}
.exp{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.exp.soon{color:var(--orange);border-color:#6b3f12;background:#2a1a08}

.card.warn{border-color:#6b3f12}
.card.bad{border-color:var(--danger)}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#2a1a08;border:1px solid #6b3f12;color:#ffcf9e;font-size:14px;margin-bottom:8px;cursor:pointer}

.alert.green{background:#12261a;border-color:#2a5a3a;color:#bff0d0}
.usebtn{flex:0 0 auto;align-self:center;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}

.gitem.done{opacity:.55} .gitem.done .box{background:var(--accent);border-color:var(--accent)} .gitem.done .gname{text-decoration:line-through}

.src-f{color:var(--ok);font-size:11px} .src-e{color:var(--orange);font-size:11px}
/* 0.5.4 · frosted glass */
:root{ --bg:rgba(6,8,10,.42); --panel:rgba(255,255,255,.06); --panel2:rgba(255,255,255,.1); --line:rgba(255,255,255,.11); --raw:#8fd3ff; --cooked:#9be89b; --glass:rgba(22,25,29,.62); --r:18px; }
html{background:#07090b}
html,body{background:#07090b}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 30% at 18% 12%,rgba(198,244,50,.16),transparent 70%),radial-gradient(35% 28% at 88% 28%,rgba(90,176,255,.18),transparent 70%),
  radial-gradient(40% 32% at 25% 78%,rgba(179,136,255,.15),transparent 70%),radial-gradient(34% 26% at 85% 88%,rgba(255,138,42,.13),transparent 70%),#07090b}
.tile,.card,.macrocard,.daycard,.minirec,.prog,.exc,.tpex,.tpcard,.win,.remind,.bkcard,.bubble{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.18)}
.tile,.macrocard,.bubble,.remind,.minirec{-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.tile.big{background:linear-gradient(160deg,#d4ff4a,#a9d81f);border-color:transparent}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sheet{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.overlay{background:rgba(0,0,0,.42)}
input,select,textarea,.search{background:rgba(0,0,0,.28);border-color:var(--line)}
.sitem{background:rgba(255,255,255,.05);border-color:var(--line)}
.btn{background:rgba(255,255,255,.09);border-color:var(--line)}
.btn.primary{box-shadow:0 6px 20px rgba(198,244,50,.18)}
.tabbar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:26px;border:1px solid rgba(255,255,255,.14);background:rgba(28,31,36,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.4);max-width:520px;margin:0 auto}
.tabbar button{border-radius:20px;padding:7px 0}
.tabbar button.on{background:rgba(198,244,50,.16);color:var(--accent)}
.tabbar.hide{display:none}
.fab{bottom:calc(92px + env(safe-area-inset-bottom))!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.page.slideL{animation:slL .28s ease-out} .page.slideR{animation:slR .28s ease-out}
@keyframes slL{from{opacity:.3;transform:translateX(40px)}to{opacity:1;transform:none}} @keyframes slR{from{opacity:.3;transform:translateX(-40px)}to{opacity:1;transform:none}}
/* launcher */
#pgLaunch header{padding-top:28px}
.page:not(#pgLaunch){padding-bottom:calc(170px + env(safe-area-inset-bottom))}
#pgLaunch h1{font-size:30px}
.bubbles{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.bubble{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:16px;align-items:center;text-align:left;color:var(--text);padding:22px 20px;border-radius:30px;cursor:pointer;min-height:118px;overflow:hidden}
.bubble .bi{grid-row:1/3;font-size:46px;width:70px;height:70px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.bubble b{font-size:22px;letter-spacing:-.3px;align-self:end} .bubble small{color:var(--muted);font-size:14px;align-self:start}
.bubble .mbar{position:absolute;left:20px;right:20px;bottom:12px;height:4px}
.bubble:active{transform:scale(.98)}
.b-food{border-color:rgba(198,244,50,.25)} .b-today{border-color:rgba(90,176,255,.28)} .b-gym{border-color:rgba(255,138,42,.28)}
.b-food::after,.b-today::after,.b-gym::after{content:"";position:absolute;inset:auto -30% -60% auto;width:70%;height:120%;border-radius:50%;filter:blur(30px);opacity:.35;pointer-events:none}
.b-food::after{background:#c6f432} .b-today::after{background:#5ab0ff} .b-gym::after{background:#ff8a2a}
.bkcard{display:block;width:100%;text-align:left;margin-top:14px;padding:14px 16px;border-radius:20px;color:var(--text);cursor:pointer}
.bkcard b{display:block} .bkcard small{color:var(--muted)}
/* setup */
.sudots{display:flex;gap:6px;justify-content:center;margin:2px 0 14px} .sudots i{width:26px;height:4px;border-radius:4px;background:rgba(255,255,255,.15)} .sudots i.on{background:var(--accent)}
.langpick button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.daychips button{min-width:44px}
/* raw / cooked tags */
.sttag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:6px;margin-right:4px;vertical-align:1px;background:rgba(255,255,255,.12);color:var(--text)}
.sttag.raw{background:rgba(143,211,255,.2);color:var(--raw);border:1px solid rgba(143,211,255,.45)}
.sttag.cooked{background:rgba(155,232,155,.18);color:var(--cooked);border:1px solid rgba(155,232,155,.45)}
/* log search */
.searchrow{display:flex;gap:8px;align-items:center} .searchrow .search{flex:1;margin:4px 0 10px} .searchrow .scanin{flex:0 0 46px;height:46px;margin-bottom:6px;font-size:20px}
.srow{display:flex;gap:6px;align-items:stretch} .srow .sitem{flex:1;min-width:0}
.qlog{flex:0 0 48px;border-radius:12px;border:1px solid rgba(198,244,50,.35);background:rgba(198,244,50,.12);color:var(--accent);font-size:22px;font-weight:700;cursor:pointer}
.qabtn{width:100%;margin-top:12px;border-style:dashed}
#amFridgeWrap input{display:none} #amFridgeWrap span{color:var(--muted);font-size:13px}
/* today reminder */
#gymBox{display:none!important}
.remind{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:10px 12px;margin:8px 0 10px;animation:remIn .45s cubic-bezier(.2,.8,.2,1);border-color:rgba(255,138,42,.3)}
.remind .rmtxt{flex:1;font-size:14px;line-height:1.45} .remind .rmrec{color:#ffcf9e;font-size:13px;cursor:pointer;margin-top:2px}
.remind .rmbtns{display:flex;gap:4px} .remind .rmbtns .linkbtn{padding:2px 6px;font-size:15px}
@keyframes remIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.dblocks{font-size:inherit;color:inherit}
/* shopping review */
.opt span small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.shoprow{display:grid;grid-template-columns:34px 1fr auto 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shoprow.off{opacity:.45}
.shoprow .box{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--accent);font-weight:800;cursor:pointer}
.shoprow:not(.off) .box{background:rgba(198,244,50,.16);border-color:rgba(198,244,50,.5)}
.shoprow .sname{min-width:0;cursor:pointer} .shoprow .sname b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .shoprow .sname small{color:var(--muted);font-size:12px}
.sqty{display:flex;align-items:center;gap:3px} .sqty input{width:38px;padding:6px 4px;text-align:center;font-size:14px} .sqty input[data-ssize]{width:56px} .sqty small,.sqty span{color:var(--muted);font-size:12px}
.sloc{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:18px;cursor:pointer}
/* gym: steppers */
.sethead,.setrow{grid-template-columns:34px 1fr 1fr 44px!important;gap:6px}
.snum{height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-weight:800;font-size:15px;cursor:pointer;padding:0}
.t-W .snum{color:var(--c);border-color:rgba(255,181,71,.4)} .t-D .snum{color:var(--p);border-color:rgba(90,176,255,.4)} .t-F .snum{color:var(--danger);border-color:rgba(255,92,92,.4)}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25);height:40px}
.stepper button{flex:0 0 32px;border:0;background:rgba(255,255,255,.07);color:var(--text);font-size:19px;font-weight:700;cursor:pointer;padding:0}
.stepper button:active{background:rgba(198,244,50,.25)}
.stepper input,.setrow .stepper input{flex:1;min-width:0;width:100%;border:0;border-radius:0;background:none;text-align:center;font-size:17px;font-weight:700;padding:0 2px}
.stepper b{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px}
.setrow.done .stepper{border-color:#2a5a3a;background:rgba(89,211,140,.08)}
.sok{height:40px;border-radius:12px}
.exbtns .formb,.tpb .formb{border-color:rgba(90,176,255,.45)!important;color:var(--p)!important}
.gother{display:block;margin:6px auto 0;color:var(--muted)}
/* template editor */
.tpcard{border-radius:16px;padding:10px 12px;margin-bottom:10px}
.tph{display:flex;gap:10px;align-items:center} .tph .ttl{flex:1;min-width:0} .tph .ttl b{display:block} .tph .ttl small{color:var(--muted);font-size:12px}
.tpb{display:flex;gap:6px} .tpb button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;font-size:14px}
.tpsteps{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;align-items:end}
.tps small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.restchip{height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--p);padding:0 10px;font-weight:600;cursor:pointer;white-space:nowrap}
#tpTypeShow{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:15px}
/* form demo */
.demoimg{position:relative;width:100%;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:#fff}
.demoimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.demoimg img.on{opacity:1}
.demosteps li{font-size:14px;margin-bottom:6px}
.formwide{width:100%;margin-bottom:12px;border-color:rgba(90,176,255,.45);color:var(--p)}
/* smooth slider */
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:none;border:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,#59d38c,#ffb547,#ff5c5c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
/* weigh-in */
.wibox{margin-top:14px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.wibox h3{margin:0 0 8px}

</style>

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-th]').forEach(el => el.innerHTML = t(el.dataset.th));
  document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = t(el.dataset.tp));
  setSeg('#sLang', lang);
}

const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const L = o => o ? (lang === 'el' ? o.el : o.en) : '';
function subOf(cat, sub){ const c = CAT[cat]; return c ? (c.subs.find(s => s.id === sub) || c.subs[0]) : null; }
function iconOf(f){ const s = subOf(f.cat, f.sub); return s ? s.icon : null; }
function typeLabel(cat, sub){ const c = CAT[cat]; if(!c) return ''; const s = subOf(cat, sub); return s.id === 'general' ? L(c) : `${L(c)} · ${L(s)}`; }

function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ς/g,'σ').replace(/\s+/g,' ').trim(); }
function guessType(text){
  const tx = norm(text); if(!tx) return null;
  let best = null, score = 0;
  for(const c of CATS) for(const s of c.subs) for(const k of s.kw){
    if(tx.includes(k)){ const sc = k.length + (s.opt.s ? 20 : 0); if(sc > score){ score = sc; best = { cat:c.id, sub:s.id }; } }
  }
  return best;
}
function guessState(name){
  const n = norm(name);
  return /ρυζι|rice|pasta|μακαρον|ζυμαρικ|spaghetti|σπαγγετ|πεννε|κριθαρακ|χυλοπιτ|oat|βρωμη|φακεσ|lentil|ρεβυθ|φασολια|quinoa|κινοα|κοτοπουλ|chicken|κιμα|mince|μοσχαρ|beef|χοιριν|pork|σολομ|salmon|ψαρι|γαριδ|αλευρ|flour/.test(n)
    && !/βραστ|ψητ|καπνιστ|μαγειρεμεν|cooked|grilled|smoked|ζαμπον|ham|κονσερβ/.test(n) ? 'uncooked' : 'ready';
}
function guessPieces(cat, sub, name){
  const n = norm(name);
  if(sub === 'bread') return /αλευρ|flour|τριμμα/.test(n) ? 'none' : 'slice';
  if(['wrap','crackers','biscuits','egg','bar','sausage','cake'].includes(sub)) return 'piece';
  if(['cheese','coldcuts'].includes(sub) && /φετεσ|σε φετ|slice|τοστ|toast/.test(n)) return 'slice';
  return 'none';
}

function load(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast(t('saveFail')); return false; } }
function migrate(f){
  const clean = Object.fromEntries(Object.entries(f || {}).filter(([,v]) => v !== undefined && v !== null));
  const out = Object.assign({ unit:'g', packs:[], usualPack:null, noBrand:false, cat:null, sub:null, state:'ready' }, clean);
  if(!['g','ml'].includes(out.unit)) out.unit = 'g';
  if(!['uncooked','cooked','ready'].includes(out.state)) out.state = 'ready';
  out.packs = Array.isArray(out.packs) ? out.packs.map(Number).filter(n => n > 0) : [];
  out.noBrand = !!out.noBrand;
  if(!['none','slice','piece'].includes(out.pieces)) out.pieces = guessPieces(out.cat, out.sub, out.name);
  if(!['auto','piece','pack','100'].includes(out.display)) out.display = 'auto';
  out.pieceSkipped = !!out.pieceSkipped;
  return out;
}

const SMALL_PACK = 350;
function portion(f){
  const pw = f.pieces && f.pieces !== 'none' ? (f.piece || f.serving || null) : null;
  const pack = f.usualPack || null;
  let mode = f.display || 'auto';
  if(mode === 'auto') mode = pw ? 'piece' : (pack && pack <= SMALL_PACK ? 'pack' : '100');
  if(mode === 'piece' && !pw) mode = pack ? 'pack' : '100';
  if(mode === 'pack' && !pack) mode = '100';
  if(mode === 'piece') return { mode, amt: pw, label: t('perWLabel', { w: W(f.pieces) }), size: `${f.piece ? '' : '≈'}${fmtSize(pw, f.unit)}` };
  if(mode === 'pack') return { mode, amt: pack, label: t('perPackLabel'), size: fmtSize(pack, f.unit) };
  return { mode, amt: 100, label: t('per100Label', { u: f.unit }), size: '' };
}

function render(){

    .concat(counts.none ? [`<button class="fchip ${ui.cat==='none'?'on':''}" data-c="none">${t('noType')} ${counts.none}</button>`] : []);
  $('catChips').innerHTML = foods.length ? chips.join('') : '';

  const tokens = q.split(' ').filter(Boolean);
  const items = foods
    .filter(f => ui.cat === 'all' || (f.cat || 'none') === ui.cat)
    .filter(f => !tokens.length || (h => tokens.every(tk => h.includes(tk)))(foodHay(f)))
    .sort(ui.sort === 'recent' ? (a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||'') : (a,b) => norm(foodName(a)).localeCompare(norm(foodName(b))) || norm(a.brand).localeCompare(norm(b.brand)));
  $('count').textContent = foods.length ? (items.length === 1 ? t('nFood') : t('nFoods', { n: items.length })) : '';
  if(!foods.length){ $('list').innerHTML = `<div class="empty">${t('noFoods')}</div>`; return; }

  $('list').innerHTML = items.map(f => {
    const ic = iconOf(f), pt = portion(f), x = pt.amt / 100;

const FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128'];
let detector = null, detectorP = null, stream = null, scanLoop = null, scanOn = false, torchOn = false;
function getDetector(){
  if(detector) return Promise.resolve(detector);
  if(detectorP) return detectorP;
  detectorP = (async () => {
    if('BarcodeDetector' in window){
      try{ const sup = await window.BarcodeDetector.getSupportedFormats();
        if(sup.includes('ean_13')) return detector = new window.BarcodeDetector({ formats: FORMATS.filter(f => sup.includes(f)) }); }catch(e){}
    }
    const m = await import('https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/es/ponyfill.min.js');
    return detector = new m.BarcodeDetector({ formats: FORMATS });
  })().catch(e => { detectorP = null; throw e; });
  return detectorP;
}

  return (10 - sum % 10) % 10 === check;
}

          if(hit){ if(hit === last){ scanOn = false; navigator.vibrate?.(60); stopScan(); lookup(hit); return; } last = hit; }

function parseQty(p){
  let n = Number(p.product_quantity), u = String(p.product_quantity_unit || '').toLowerCase();
  if(!(n > 0)){
    const m = String(p.quantity || '').toLowerCase().replace(',', '.').match(/(\d+(?:\.\d+)?)\s*(kg|g|gr|l|lt|ml|cl)\b/);
    if(!m) return null; n = Number(m[1]); u = m[2];
    if(u === 'kg'){ n *= 1000; u = 'g'; } if(u === 'l' || u === 'lt'){ n *= 1000; u = 'ml'; } if(u === 'cl'){ n *= 10; u = 'ml'; } if(u === 'gr') u = 'g';
  }
  return (u === 'g' || u === 'ml') ? { size: Math.round(n), unit: u } : null;
}
const OFF_FIELDS = 'code,product_name,product_name_el,product_name_en,generic_name,brands,nutriments,serving_quantity,quantity,product_quantity,product_quantity_unit,categories_tags';
function offToFood(p, code){
  const n = p.nutriments || {};
  const g = k => { const v = n[k + '_100g']; return (v === undefined || v === '' || v === null) ? null : r1(Number(v)); };
  let kcal = g('energy-kcal'); if(kcal === null && n['energy_100g'] != null) kcal = Math.round(Number(n['energy_100g']) / 4.184);
  const q = parseQty(p);
  return {
    barcode: code || p.code || null, brand: (p.brands || '').split(',')[0].trim(),
    name: (lang === 'el' ? p.product_name_el : p.product_name_en) || p.product_name || p.product_name_el || p.product_name_en || p.generic_name || '',
    hint: (p.categories_tags || []).slice(-3).map(x => x.replace(/^\w\w:/,'').replace(/-/g,' ')).join(' '),
    kcal, protein: g('proteins'), carbs: g('carbohydrates'), fat: g('fat'),
    fiber: g('fiber'), sugar: g('sugars'), satFat: g('saturated-fat'), salt: g('salt'), potassium: n['potassium_100g'] != null ? Math.round(Number(n['potassium_100g']) * 1000) : null,
    serving: p.serving_quantity ? Number(p.serving_quantity) : null,
    unit: q ? q.unit : undefined, unitFromLabel: !!q, packs: q ? [q.size] : [], usualPack: q ? q.size : null, source: 'openfoodfacts'

}
async function lookup(code){

// Free Gemini models get overloaded, so we try every model your key can use, each for at most 30 s, until one answers.
const MLKEY = 'ft.models.v1', GEMINI_TIMEOUT = 30000, GAPI = 'https://generativelanguage.googleapis.com/v1beta/models';
function fetchT(url, opts, ms, outer){
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), ms);
  const onOuter = () => ctl.abort();
  if(outer){ if(outer.aborted) ctl.abort(); else outer.addEventListener('abort', onOuter); }
  return fetch(url, { ...opts, signal: ctl.signal }).finally(() => { clearTimeout(timer); if(outer) outer.removeEventListener('abort', onOuter); });
}
function sortModels(names){
  const ver = n => { const m = n.match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const tier = n => /latest/.test(n) ? 0 : /preview|exp/.test(n) ? 2 : 1;
  const kind = n => /flash-lite/.test(n) ? 1 : /flash/.test(n) ? 0 : /pro/.test(n) ? 3 : 2;
  return names.sort((a,b) => tier(a) - tier(b) || ver(b) - ver(a) || kind(a) - kind(b));
}
async function listModels(){
  const tag = settings.geminiKey.slice(-6), c = load(MLKEY, null);
  if(c && c.tag === tag && Date.now() - c.at < 864e5 && c.list && c.list.length) return c.list;
  try{
    const r = await fetchT(`${GAPI}?pageSize=200`, { headers:{ 'x-goog-api-key': settings.geminiKey } }, 10000);
    if(!r.ok) return [];
    const j = await r.json();
    const list = sortModels((j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace(/^models\//, ''))
      .filter(n => /^gemini/.test(n) && !/(embed|image|tts|audio|live|aqa|robotics|computer|learnlm)/.test(n)));
    store(MLKEY, { at: Date.now(), tag, list });
    return list;
  }catch(e){ return []; }
}
async function gemini(prompt, imageB64, onTry, outer){
  const parts = [{ text: prompt }]; if(imageB64) parts.push({ inline_data:{ mime_type:'image/jpeg', data:imageB64 } });
  const chain = [...new Set([settings.model || DEFAULT_MODEL, 'gemini-flash-latest', 'gemini-flash-lite-latest', ...(await listModels())])].slice(0, 10);
  let lastErr = null;
  for(let i = 0; i < chain.length; i++){
    if(outer && outer.aborted) throw Object.assign(new Error(t('cancelled')), { cancelled: true });
    if(onTry) onTry(i + 1, chain.length, chain[i]);
    try{
      const r = await fetchT(`${GAPI}/${encodeURIComponent(chain[i])}:generateContent`, {
        method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key': settings.geminiKey },
        body: JSON.stringify({ contents:[{ parts }], generationConfig:{ responseMimeType:'application/json', temperature: imageB64 ? 0 : 0.6 } })
      }, GEMINI_TIMEOUT, outer);
      let j = null; try{ j = await r.json(); }catch(e){}
      if(!r.ok){
        const msg = (j && j.error && j.error.message) || `HTTP ${r.status}`;
        // a bad key won't work on any model, so stop right away; everything else → next model
        if(r.status === 401 || /api key not valid|api_key_invalid|denied access/i.test(msg)) throw Object.assign(new Error(t('keyBad', { e: msg.replace(/\.\s*$/, '') })), { fatal: true });
        lastErr = new Error(msg.length > 90 ? msg.slice(0, 90) + '…' : msg); continue;
      }
      const txt = (j?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
      try{ return JSON.parse(txt.replace(/^\s*```(json)?|```\s*$/g, '').trim()); }catch(e){ lastErr = new Error('unreadable answer'); continue; }
    }catch(e){
      if(e.fatal) throw e;
      if(outer && outer.aborted) throw Object.assign(new Error(t('cancelled')), { cancelled: true });
      lastErr = e && e.name === 'AbortError' ? new Error(t('timedOut')) : e;
    }
  }
  throw new Error(t('allBusy', { e: lastErr ? lastErr.message : '?' }));
}

Rules: values from the per 100 g / 100 ml column, never per serving. kcal not kJ. carbs = total carbohydrate (Υδατάνθρακες), sugar = "εκ των οποίων σάκχαρα". If only per-serving values exist, convert to per 100 using the serving size. serving = weight of one piece/slice/serving if printed. potassium in mg per 100 g if listed. unit "ml" for drinks/milk/oil. packSize = net quantity of the whole pack in g or ml. state "uncooked" for dry rice/pasta/oats/raw meat, else "ready". null for anything unreadable.`, img, onTry);

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85).split(',')[1]); };
    img.onerror = () => rej(new Error('photo')); img.src = url;
  });
}

// Order: your own foods → the standard list (works in Greek and English) → Open Food Facts online
// names are checked in both Greek and English, so "κοτόπουλο στήθος" and "chicken breast" land on the same food
function scoreHay(hay, names, tokens, q){
  if(!tokens.every(tk => hay.includes(tk))) return 0;
  let best = 0;
  for(const nm of names){ if(!nm) continue; const n = norm(nm); let s = 10;
    if(n.startsWith(q)) s += 6; else if(n.includes(q)) s += 3;
    if(tokens.every(tk => n.includes(tk))) s += 4;
    best = Math.max(best, s - Math.min(n.length, 60) / 30); }
  return best;
}
function searchLocal(text, raw){
  const q = norm(text), tokens = q.split(' ').filter(Boolean);
  if(!tokens.length) return { mine: [], std: [] };
  const names = f => [foodName(f), f.name, f.gid && GENBY[f.gid] ? GENBY[f.gid].en : '', f.gid && GENBY[f.gid] ? GENBY[f.gid].el : ''];
  const mine = foods.map(f => ({ f, s: scoreHay(foodHay(f), names(f), tokens, q) })).filter(x => x.s > 0).sort((a,b) => b.s - a.s).slice(0, 8).map(x => x.f);
  const have = new Set(foods.map(f => f.gid).filter(Boolean));
  // in recipes you weigh things raw, so cooked versions drop down the list
  const std = GEN.filter(g => !have.has(g.gid)).map(g => ({ g, s: scoreHay(g.hay, [g.en, g.el], tokens, q) - (raw && g.state === 'cooked' ? 6 : 0) }))
    .filter(x => x.s > 0).sort((a,b) => b.s - a.s).slice(0, 8).map(x => x.g);
  return { mine, std };
}
async function searchOnline(text){
  const base = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(text)}&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`;
  let j = await (await fetch(base + '&countries_tags_en=greece')).json();
  if(!j.products || !j.products.length) j = await (await fetch(base)).json();
  return (j.products || []).map(p => offToFood(p, p.code)).filter(d => d.protein !== null && d.carbs !== null && d.fat !== null && d.name).slice(0, 10);
}

function matchIng(names){
  const tryQ = q => { const s = searchLocal(q, true); return s.mine.length ? foods_ref(s.mine[0]) : s.std.length ? gen_ref(s.std[0]) : null; };
  for(const q of names){ if(!q) continue; const r = tryQ(q); if(r) return r; }
  // nothing for the full name ("κρεμμύδι ξερό")? try its main words on their own ("κρεμμύδι")

}

const FRAC = { '½':' 1/2', '¼':' 1/4', '¾':' 3/4', '⅓':' 1/3', '⅔':' 2/3', '⅛':' 1/8' };
const nk = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ');   // same length as the input, so positions line up
const R_UNITS = [
  ['kg|kgs|κιλο|κιλα|κιλ', 1000], ['g|gr|grs|gram|grams|γρ|γρμ|γραμμαρια|γραμμαριο|γραμ', 1], ['ml|μλ', 1],
  ['l|lt|ltr|litre|litres|liter|liters|λιτρο|λιτρα|λιτ', 1000],
  ['tbsp|tbs|tablespoons?|κσ|κ\\.\\s?σ\\.?|κουταλιεσ της σουπασ|κουταλια της σουπασ', 15],
  ['tsp|teaspoons?|κγ|κ\\.\\s?γ\\.?|κουταλακια|κουταλακι|κουταλιεσ του γλυκου|κουταλια του γλυκου', 5],
  ['cups?|φλιτζανια|φλιτζανι|κουπεσ|κουπα', 240], ['pinch|pinches|πρεζα|πρεζεσ', 0.5], ['cloves?|σκελιδεσ|σκελιδα|σκελιδια', 5],
];
const R_NUM = '(\\d+(?:[.,]\\d+)?(?:\\s+\\d+\\/\\d+)?|\\d+\\/\\d+)';
const R_AMT = new RegExp(`${R_NUM}\\s*(${R_UNITS.map(u => u[0]).join('|')})(?![a-zα-ω])\\.?`);
const COUNT_W = [['κρεμμυδ|onion',150],['σκορδ|garlic',40],['αυγ|egg',50],['ντοματ|tomato',120],['καροτ|carrot',70],['γλυκοπατατ|sweet potato',200],['πατατ|potato',170],
  ['πιπερια|pepper',150],['κολοκυθακ|zucchini|courgette',200],['λεμον|lemon',100],['στηθ|breast',200],['μπανανα|banana',120],['μηλ|apple',180],['αγγουρ|cucumber',300],['μελιτζαν|aubergine|eggplant',300],['πορτοκαλ|orange',150]];
function parseNum(s){ s = s.replace(',', '.').trim(); const parts = s.split(/\s+/); let v = 0;
  for(const p of parts){ if(p.includes('/')){ const [a,b] = p.split('/').map(Number); if(b) v += a / b; } else v += Number(p) || 0; } return v; }
function cleanName(s){
  return s.replace(/\([^)]*\)/g, ' ').replace(/^[\s\-–—:,.*•·x×]+|[\s\-–—:,.*•·]+$/g, '').replace(/^(of|από|απο)\s+/i, '').replace(/\s{2,}/g, ' ').trim();
}
function parseIngLine(line){
  let src = line; for(const [k,v] of Object.entries(FRAC)) src = src.split(k).join(v);
  const low = nk(src), m = low.match(R_AMT);
  if(m){
    const val = parseNum(m[1]); const u = R_UNITS.find(x => new RegExp(`^(?:${x[0]})$`).test(m[2]));
    let name = cleanName(src.slice(0, m.index) + ' ' + src.slice(m.index + m[0].length));
    let f = u ? u[1] : 1; if(f === 15 && /λαδ|oil|ελαιολαδ/.test(nk(name))) f = 13.5;
    return { name, grams: val > 0 ? r1(val * f) : null };
  }
  const c = low.match(/^\s*(\d+(?:[.,]\d+)?|\d+\/\d+|\d+\s+\d+\/\d+)\s+(?=\S)/);
  if(c){
    const n = parseNum(c[1]), name = cleanName(src.slice(c[0].length)), nn = nk(name);
    const w = COUNT_W.find(([k]) => new RegExp(k).test(nn)); const g = GEN.find(x => x.piece && (nk(x.en).includes(nn) || nn.includes(nk(x.el).split(' ')[0])));
    return { name, grams: w ? r1(n * w[1]) : g ? r1(n * g.piece) : null, count: n };
  }
  return null;
}
function parseRecipe(text){
  const H_ING = /^(ingredients?|υλικα|τα υλικα|συστατικα)\s*:?$/, H_STEP = /^(steps?|method|instructions?|directions?|preparation|how to make( it)?|οδηγιεσ|εκτελεση|βηματα|παρασκευη|διαδικασια|τροποσ παρασκευησ|μεθοδοσ)\s*:?$/;
  const lines = text.split(/\r?\n/).map(s => s.replace(/^[#>*\s]+/, '').replace(/\*\*/g, '').trim()).filter(Boolean);
  const out = { title: '', ingredients: [], steps: [] }; let mode = null;
  lines.forEach((raw, idx) => {
    const key = nk(raw).replace(/[:.]$/, '').trim();
    if(H_ING.test(key)){ mode = 'ing'; return; }
    if(H_STEP.test(key)){ mode = 'steps'; return; }
    const numbered = /^\d+\s*[.)]\s+/.test(raw) && !/^\d+[.,]\d/.test(raw);
    const body = raw.replace(/^[-–•·]\s*/, '').replace(/^\d+\s*[.)]\s+(?=\D)/, '').trim();
    const amt = mode === 'steps' ? null : parseIngLine(body);
    if(idx === 0 && !amt && mode === null && lines.length > 1 && body.length < 70 && !/[.!]$/.test(body)){ out.title = body; return; }
    if(mode === 'steps' || (mode === null && ((!amt && (numbered || body.length > 45 || /[.!]$/.test(body))) || (amt && body.length > 60)))){ out.steps.push(body); return; }
    if(amt) out.ingredients.push(amt);
    else out.ingredients.push({ name: cleanName(body), grams: null });
  });
  out.ingredients = out.ingredients.filter(i => i.name);
  return out;
}

const fromMin = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };

// ---------- where things go and how long they last (rough defaults, always editable) ----------
function defaultLoc(f){
  const c = f.cat, s = f.sub;
  if(['meat','fish','dairy','eggs','ready'].includes(c)) return 'fridge';
  if(c === 'veg') return ['potato','sweetpotato','onion','garlic'].includes(s) ? 'cupboard' : 'fridge';
  if(c === 'fruit') return ['banana','dried'].includes(s) ? 'cupboard' : 'fridge';
  if(c === 'drinks') return s === 'juice' ? 'fridge' : 'cupboard';
  return 'cupboard';
}
function defaultDays(f, loc){
  const c = f.cat, s = f.sub;
  if(loc === 'freezer') return ['meat','fish'].includes(c) ? 120 : 90;
  if(loc === 'fridge'){
    if(['chicken','turkey','mince','fishgen','salmon','shrimp','octopus','squid'].includes(s)) return 2;
    if(['beef','pork','lamb','sausage'].includes(s)) return 3;
    if(s === 'coldcuts') return 5; if(s === 'milk' || s === 'juice') return 7; if(s === 'yogurt' || s === 'cream') return 14;
    if(s === 'cheese') return 21; if(s === 'butter') return 30; if(c === 'eggs') return 28; if(c === 'ready') return 3;
    if(c === 'fruit' || c === 'veg') return 7; return 7;
  }
  if(s === 'bread') return 5; if(s === 'banana') return 5; if(['potato','sweetpotato','onion','garlic'].includes(s)) return 21;
  if(c === 'fruit' || c === 'veg') return 7; return 180;
}

// ---------- fridge items ----------

  if(it.mealId){ const m = meals.find(x => x.id === it.mealId); return m ? { name: m.name, icon: mealIcon(m), unit: 'g', per: m, piece: null, meal: m } : null; }

// take an amount out of the fridge, soonest-expiring first; returns how much was actually there
function takeFromFridge(key, amount){
  let left = amount;
  fridge.filter(it => key.foodId ? it.foodId === key.foodId : it.mealId === key.mealId)
    .sort((a, b) => (a.exp || '9999').localeCompare(b.exp || '9999'))
    .forEach(it => { if(left <= 0) return; const d = Math.min(it.qty, left); it.qty = r1(it.qty - d); left -= d; });
  fridge = fridge.filter(it => it.qty > 0.05); saveFridge();
  const added = key.foodId ? checkRestock(key.foodId) : false;

// ran out (or below your level) → onto the grocery list by itself
function checkRestock(foodId){
  const f = foods.find(x => x.id === foodId); if(!f || f.noAutoGrocery) return false;
  const have = stockOf(foodId), min = f.minStock || 0;
  const low = min > 0 ? have < min : have <= 0;
  if(!low || groc.some(g => g.foodId === foodId && !g.done)) return false;
  groc.push({ id: uid(), foodId, name: foodName(f), count: 1, size: f.usualPack || null, unit: f.unit, why: have <= 0 ? 'out' : 'low', done: false, addedAt: new Date().toISOString() });

}

// records: a WEIGHT record (heaviest set) and a VOLUME record (total kg moved across all sets) — volume counts more
function tickSet(x, s, row, xi, si){
  if(s.done){ s.done = false; s.pr = null; if(x.volPR && exVol(x.exId, x.sets) <= bestVolBefore(x.exId)){ x.volPR = false; active.prs = active.prs.filter(p => !(p.exId === x.exId && p.kind === 'v')); } saveG('act'); renderSession(); return; }
  const wi = row.querySelector('[data-w]'), ri = row.querySelector('[data-r]'), card = isCardio(x.exId);
  if(s.w === '' && wi.placeholder && !isNaN(+wi.placeholder)) s.w = wi.placeholder; if(s.r === '' && ri.placeholder && !isNaN(+ri.placeholder)) s.r = ri.placeholder;
  if(s.r === '' || (!card && s.w === '' && exById(x.exId).e !== 'bodyweight')){ toast(t('needSetVals')); (s.w === '' ? wi : ri).focus(); return; }
  if(s.w === '') s.w = '0';
  s.done = true; ensureAudio();
  if(!card && s.type !== 'W'){
    const hist = exHistory(x.exId, active.id), same = active.exercises.filter(z => z.exId === x.exId);
    if(hist.length){
      const prevMaxW = Math.max(...hist.flatMap(h => h.sets.map(z => +z.w))), curOther = Math.max(0, ...same.flatMap(z => z.sets).filter(z => z !== s && z.done && z.type !== 'W').map(z => +z.w));
      if(exById(x.exId).e !== 'bodyweight' && +s.w > prevMaxW && +s.w > curOther){ s.pr = 'w'; active.prs.push({ exId: x.exId, kind: 'w', w: +s.w, r: +s.r }); celebrate('🏋️'); toast(t('prW', { n: exName(x.exId), w: fmt(+s.w), r: s.r })); petAward('pr', 1); }
      const prevVol = bestVolBefore(x.exId), curVol = same.reduce((a, z) => a + exVol(x.exId, z.sets), 0);
      if(!x.volPR && curVol > prevVol){ x.volPR = true; s.pr = 'v'; active.prs = active.prs.filter(p => !(p.exId === x.exId && p.kind === 'v'));
        active.prs.push({ exId: x.exId, kind: 'v', vol: Math.round(curVol), prev: Math.round(prevVol) });
        celebrate('📈'); setTimeout(() => celebrate('🏆'), 350); toast(t('prV', { n: exName(x.exId), v: Math.round(curVol).toLocaleString() })); petAward('vpr', 2); }
      else if(x.volPR){ const p = active.prs.find(p => p.exId === x.exId && p.kind === 'v'); if(p) p.vol = Math.round(curVol); }
    }
  }
  saveG('act');
  if(!card){ REST = { end: Date.now() + (s.type === 'W' ? 60 : x.rest) * 1000, total: s.type === 'W' ? 60 : x.rest, rang: false, xi, si }; }
  renderSession(); tickRest();
}
const bestVolBefore = exId => { const h = exHistory(exId, active && active.id); return h.length ? Math.max(...h.map(z => exVol(exId, z.sets.map(s => ({ ...s, done: true }))))) : 0; };

// ---------- rest timer (under the set) with a boxing-bell sound ----------
let REST = null, audioCtx = null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }
function bell(){
  try{ ensureAudio(); const now = audioCtx.currentTime;
    [0, .32, .64].forEach(d => [[1, .5], [2.76, .25], [5.4, .14], [8.93, .07]].forEach(([ratio, g0]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = 640 * ratio;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, now + d); g.gain.exponentialRampToValueAtTime(g0, now + d + .008); g.gain.exponentialRampToValueAtTime(.0001, now + d + 1.4 / Math.sqrt(ratio));
      o.start(now + d); o.stop(now + d + 1.5); })); }catch(e){}
}
const beep = bell;
function startRest(sec){ if(sec > 0){ REST = { end: Date.now() + sec * 1000, total: sec, rang: false, xi: -1, si: -1 }; tickRest(); } }
function tickRest(){
  if(!REST) return; const left = Math.round((REST.end - Date.now()) / 1000);
  if(left <= 0 && !REST.rang){ REST.rang = true; bell(); navigator.vibrate?.([300, 120, 300]); const el = document.querySelector('.restin'); if(el) el.classList.add('over'); if(!$('ovSession').classList.contains('open')) toast(t('restDone')); }
  const tx = $('restTxt2'), pr = $('restProg2');
  if(tx) tx.textContent = left > 0 ? `${t('restLbl')} ${fmtRest(left)}` : t('restOver');
  if(pr) pr.style.width = `${Math.max(0, Math.min(100, (1 - left / REST.total) * 100))}%`;
  if(left < -45){ REST = null; if(active && $('ovSession').classList.contains('open')) renderSession(); }
}
function restAdjust(v){ if(!REST) return; if(v === 'skip'){ REST = null; renderSession(); return; }
  REST.end += +v * 1000; REST.total = Math.max(REST.total, Math.round((REST.end - Date.now()) / 1000)); if(REST.end > Date.now()) REST.rang = false; renderSession(); tickRest(); }

// ---------- 💡 what next? muscles you haven't hit yet (free) + ✨ Gemini ----------
function hitsFrom(list, includeUndone){
  const hits = {};
  list.forEach(s => s.exercises.forEach(x => { const ex = exById(x.exId);
    x.sets.filter(z => z.type !== 'W' && (z.done || (includeUndone && !x.ended))).forEach(() => Object.entries(ex.mu).forEach(([h, v]) => { if(HEADS[h]) hits[h] = (hits[h] || 0) + v / 100; })); }));
  return hits;
}
function nextSuggestions(){
  if(!active) return [];
  const ses = hitsFrom([active], true), week = hitsFrom(sessions.filter(s => -daysUntil(s.date) <= 6), false);
  const regionOk = h => { const r = GROUPS[HEADS[h][2]][2]; return h !== 'cardio' && (active.type === 'full' || (active.type === 'legs' ? r === 'low' : active.type === 'upper' ? r === 'up' : false)); };
  const heads = Object.keys(HEADS).filter(regionOk).filter(h => h !== 'forearms' && h !== 'lower_back')
    .map(h => ({ h, s: ses[h] || 0, w: week[h] || 0 })).filter(x => x.s < 2).sort((a, b) => (a.s * 3 + a.w) - (b.s * 3 + b.w)).slice(0, 4);
  const used = new Set(active.exercises.map(x => x.exId));
  return heads.map(x => ({ ...x, ex: EX().filter(e => !used.has(e.id) && (e.mu[x.h] || 0) >= 50).sort((a, b) => (exHistory(b.id).length - exHistory(a.id).length) || (b.mu[x.h] - a.mu[x.h]) || (b.rest - a.rest)).slice(0, 3) })).filter(x => x.ex.length);
}

// ---------- progress ----------
function spark(vals){
  if(vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), w = 90, h = 28, sx = w / (vals.length - 1), sy = mx === mn ? 0 : (h - 4) / (mx - mn);
  const pts = vals.map((v, i) => `${(i * sx).toFixed(1)},${(h - 2 - (v - mn) * sy).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function strengthChange(exId){
  const h = exHistory(exId); if(!h.length) return null;
  const now = Date.now(), d = s => (now - new Date(s.start)) / 864e5;
  const recent = h.filter(x => d(x) <= 28), prev = h.filter(x => d(x) > 28 && d(x) <= 56);
  const best = a => a.length ? Math.max(...a.map(x => x.e1)) : null;
  const r = best(recent), p = best(prev), first = h[0].e1, all = best(h);
  return { h, best: all, pct: r && p ? (r / p - 1) * 100 : null, since: r && h.length > 1 ? (r / first - 1) * 100 : null };
}
function renderProgress(){
  const el = $('gProgV'), gap = gapDays();
  let h = '';
  if(!sessions.length){
    h += `<div class="empty" style="margin-top:10px">${t('progNone')}</div><label for="gLast" style="margin-top:14px">${t('lastTrained')}</label><input id="gLast" type="date" value="${ui.gymLast || ''}" max="${todayKey()}">`;
    el.innerHTML = h; return;
  }
  const ids = [...new Set(sessions.flatMap(s => s.exercises.map(x => x.exId)))].filter(id => !isCardio(id));
  const rows = ids.map(id => ({ id, c: strengthChange(id) })).filter(x => x.c).sort((a, b) => b.c.h.length - a.c.h.length);
  const pcts = rows.map(x => x.c.pct).filter(v => v !== null), avg = pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : null;
  const sinces = rows.map(x => x.c.since).filter(v => v !== null), avgS = sinces.length ? sinces.reduce((a, b) => a + b, 0) / sinces.length : null;
  const goal = targets && targets.goal, v = avg ?? avgS;
  const msg = v === null ? '' : goal === 'cut' ? (v >= -2 ? t('gCutHold') : t('gCutDrop')) : v > 2 ? t('gBulkUp') : v < -2 ? t('gDown') : t('gFlat');
  const cls = x => x === null ? 'flat' : x > 1 ? 'up' : x < -1 ? 'down' : 'flat', sg = x => x === null ? '–' : `${x > 0 ? '+' : ''}${x.toFixed(1)}%`;
  h += `<div class="macrocard"><div class="row"><span class="rmeta">${avg !== null ? t('progOverall') : t('progSinceStart')}</span><span class="pct ${cls(v)}" style="font-size:24px">${sg(v)}</span></div>${msg ? `<p class="hint" style="margin:6px 0 0">${msg}</p>` : ''}</div>`;
  h += `<h3 class="sect">${t('gtProgress')}</h3>` + rows.map(({ id, c }) => { const top = c.h[c.h.length - 1].top;
    return `<div class="prog"><div><b>${esc(exName(id))}</b><small>${t('lastTime')} ${fmt(+top.w)}×${top.r} · ${t('best')} ${Math.round(c.best)}</small></div>${spark(c.h.map(x => x.e1))}<span class="pct ${cls(c.pct ?? c.since)}">${sg(c.pct ?? c.since)}</span></div>`; }).join('');
  h += `<h3 class="sect">${t('historyT')}</h3><div class="list">` + sessions.slice().sort((a, b) => b.start.localeCompare(a.start)).slice(0, 10).map(s => `<div class="card" data-ses="${s.id}"><div class="ficon">🏋️</div><div class="body">
    <div class="row"><div class="name">${esc(s.name)}</div><span class="rmeta">${fmtDate(s.start)}</span></div><div class="rmeta">${s.mins} min · ${s.vol.toLocaleString()} kg${s.prs.length ? ` · 🏆 ${s.prs.length}` : ''}</div></div></div>`).join('') + '</div>';
  el.innerHTML = h;
}

function nextSuggestions(){
  if(!active) return [];
  const ses = hitsFrom([active], true), week = hitsFrom(sessions.filter(s => -daysUntil(s.date) <= 6), false), ty = active.type;
  const want = h => { if(h === 'cardio') return false; if(TYPE_HEADS[ty]) return TYPE_HEADS[ty].includes(h); const r = GROUPS[HEADS[h][2]][2];
    return ty === 'full' || (workKind(ty) === 'legs' ? r === 'low' : r === 'up'); };
  const heads = Object.keys(HEADS).filter(want).filter(h => h !== 'forearms' && h !== 'lower_back')
    .map(h => ({ h, s: ses[h] || 0, w: week[h] || 0 })).filter(x => x.s < 2).sort((a, b) => (a.s * 3 + a.w) - (b.s * 3 + b.w)).slice(0, 4);
  const used = new Set(active.exercises.map(x => x.exId));
  return heads.map(x => ({ ...x, ex: EX().filter(e => !used.has(e.id) && (e.mu[x.h] || 0) >= 50).sort((a, b) => (exHistory(b.id).length - exHistory(a.id).length) || (b.mu[x.h] - a.mu[x.h]) || (b.rest - a.rest)).slice(0, 3) })).filter(x => x.ex.length);
}

function useCounts(){
  const c = {}; Object.keys(dayLog).sort().slice(-90).forEach(d => (dayLog[d] || []).forEach(e => { if(e.refId) c[e.refId] = (c[e.refId] || 0) + 1; }));

}
function searchLocal(text, raw, opts){
  const q = norm(text), tokens = q.split(' ').filter(Boolean); opts = opts || {};
  if(!tokens.length) return { mine: [], std: [] };
  const uc = useCounts(), habit = n => n ? Math.min(8, 3 + n / 2) : 0;
  const names = f => [foodName(f), f.name, f.gid && GENBY[f.gid] ? GENBY[f.gid].en : '', f.gid && GENBY[f.gid] ? GENBY[f.gid].el : ''];
  const cookBias = st => raw ? (st === 'cooked' ? -6 : 0) : opts.log ? (st === 'cooked' ? 1.5 : 0) : 0;
  const mine = foods.map(f => { const s = scoreHay(foodHay(f), names(f), tokens, q); return { f, s: s > 0 ? s + habit(uc[f.id]) + (f.gid ? popBonus(f.gid) : 0) + cookBias(f.state) : 0 }; })
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, opts.mineMax || 20).map(x => x.f);
  const have = new Set(foods.map(f => f.gid).filter(Boolean));
  const std = GEN.filter(g => !have.has(g.gid)).map(g => { const s = scoreHay(g.hay, [g.en, g.el], tokens, q); return { g, s: s > 0 ? s + popBonus(g.gid) + cookBias(g.state) : 0 }; })
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, opts.stdMax || 50).map(x => x.g);
  return { mine, std };
}

      fiber: fib, salt: nv(f, [1093, 307]) != null ? r1(nv(f, [1093, 307]) * 2.5 / 1000 * 100) / 100 : null, potassium: nv(f, [1092, 306]), unit: 'g', packs: [], usualPack: null,

const WKEY = 'ft.weights.v1'; let weights = load(WKEY, {});
function weightTrend(){
  const pts = Object.entries(weights).map(([d, w]) => [new Date(d + 'T12:00:00').getTime() / 864e5, +w]).filter(p => p[1] > 0).sort((a, b) => a[0] - b[0]);
  const now = Date.now() / 864e5, rec = pts.filter(p => now - p[0] <= 28); if(rec.length < 3) return null;
  const span = rec[rec.length - 1][0] - rec[0][0]; if(span < 6) return null;
  const n = rec.length, mx = rec.reduce((a, p) => a + p[0], 0) / n, my = rec.reduce((a, p) => a + p[1], 0) / n;
  const slope = rec.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / rec.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
  return { perWeek: slope * 7, days: Math.round(span), last: rec[rec.length - 1][1], pts: rec.map(p => p[1]) };
}
function weighAdvice(tr){
  const goal = (targets && targets.goal) || 'bulk', pct = tr.perWeek / tr.last * 100;
  if(goal === 'bulk') return pct < .25 ? { msg: t('wiSlowBulk'), d: 150 } : pct > .6 ? { msg: t('wiFastBulk'), d: -150 } : { msg: t('wiOk'), d: 0 };
  if(goal === 'cut') return pct > -.4 ? { msg: t('wiSlowCut'), d: -200 } : pct < -1.1 ? { msg: t('wiFastCut'), d: 150 } : { msg: t('wiOk'), d: 0 };
  return Math.abs(pct) > .3 ? { msg: t('wiRecomp'), d: pct > 0 ? -100 : 100 } : { msg: t('wiOk'), d: 0 };
}

  if(!tr){ $('wiOut').innerHTML = `<p class="hint">${t('wiNeed')}</p>`; return; }

  const ap = $('wiApply'); if(ap) ap.onclick = () => { ['gym', 'rest'].forEach(k => { if(targets[k]){ targets[k].k = Math.round((targets[k].k + a.d) / 50) * 50; targets[k].c = Math.max(0, Math.round((targets[k].c + a.d / 4) / 5) * 5); } });

}

function claudeText(){
  const out = [`My Tracker data. Store-bought foods: ${foods.length}. Home-cooked meals: ${meals.length}. Macros are per 100 g or 100 ml as marked; [uncooked] = raw/dry weight, [cooked] = cooked weight. Exported ${new Date().toLocaleDateString('en-GB')}.`];
  const byCat = {};
  foods.forEach(f => { const k = f.cat ? CAT[f.cat].en : 'No type'; (byCat[k] = byCat[k] || []).push(f); });
  for(const [cat, list] of Object.entries(byCat).sort()){
    out.push(`\n${cat}:`);
    list.sort((a,b) => norm(a.name).localeCompare(norm(b.name))).forEach(f => out.push(
      `- ${f.noBrand ? '' : (f.brand ? f.brand + ' ' : '')}${f.gid && GENBY[f.gid] ? GENBY[f.gid].en : f.name}${f.sub && f.sub !== 'general' ? ` (${subOf(f.cat,f.sub).en.toLowerCase()})` : ''} [${f.state === 'ready' ? 'ready to eat' : f.state}], per 100 ${f.unit}: ${fmt(f.kcal)} kcal, P ${fmt(f.protein)} / C ${fmt(f.carbs)} / F ${fmt(f.fat)}` +
      (f.fiber!=null?`, fibre ${fmt(f.fiber)}`:'') + (f.sugar!=null?`, sugar ${fmt(f.sugar)}`:'') +
      (f.packs.length ? `; packs ${f.packs.map(p => fmtSize(p, f.unit)).join(', ')}${f.usualPack ? ` (usually ${fmtSize(f.usualPack, f.unit)})` : ''}` : '') +
      (f.pieces !== 'none' && (f.piece || f.serving) ? `; 1 ${f.pieces} = ${f.piece ? '' : '~'}${fmtSize(r1(f.piece || f.serving), f.unit)}${f.piece ? ' (weighed)' : ' (database estimate)'}` : '') +
      (f.notes ? ` — ${f.notes}` : '')));
  }
  if(meals.length){
    out.push('\nHome-cooked meals (per 100 g cooked):');
    meals.forEach(m => out.push(`- ${m.name}: ${m.kcal} kcal, P ${fmt(m.protein)} / C ${fmt(m.carbs)} / F ${fmt(m.fat)}; batch ${fmtSize(m.cookedWeight,'g')}${m.cookedEstimated ? ' (not weighed, raw total used)' : ''}; ingredients: ${m.ingredients.map(i => `${i.ref.name} ${fmtSize(i.grams, i.ref.unit)}`).join(', ')}${m.recipe ? '; has recipe' : ''}`));
  }
  const fl = liveItems();
  if(fl.length){ out.push('\nIn my fridge/freezer/cupboard right now:');
    fl.forEach(x => out.push(`- ${x.info.food && x.info.food.gid && GENBY[x.info.food.gid] ? GENBY[x.info.food.gid].en : x.info.name}${x.it.mealId ? ' (leftovers)' : ''}: ${fmtSize(x.it.qty, x.info.unit)} in the ${x.it.loc}${x.it.exp ? `, expires ${x.it.exp}` : ''}`)); }
  const gl = groc.filter(g => !g.done);
  if(gl.length) out.push('\nGrocery list: ' + grocText().split('\n').join('; '));
  if(targets) out.push(`\nMy targets (${targets.goal}${targets.bw ? ', ' + targets.bw + ' kg' : ''}): gym day ${targets.gym.k} kcal P${targets.gym.p} C${targets.gym.c} F${targets.gym.f}; rest day ${targets.rest.k} kcal P${targets.rest.p} C${targets.rest.c} F${targets.rest.f}`);
  const td = dayLog[todayKey()] || [], di = dayInfo(todayKey());
  if(td.length){ const tt = dayTotals(todayKey()); out.push(`\nToday (${di.type === 'gym' ? 'gym day: ' + (di.work || '') + ' at ' + (di.time || '?') : 'rest day'}) I've eaten ${Math.round(tt.kcal)} kcal, P${Math.round(tt.p)} C${Math.round(tt.c)} F${Math.round(tt.f)}:`);
    td.slice().sort((a, b) => a.time.localeCompare(b.time)).forEach(e => out.push(`- ${e.time} ${e.name} ${fmtSize(e.amt, e.unit)} (${e.kcal} kcal)`)); }
  if(sessions.length || Object.keys(gymPlan).length){
    out.push('\nGym week: ' + [1, 2, 3, 4, 5, 6, 0].map(wd => { const p = gymPlan[wd]; const tp = p && tpls.find(x => x.id === p.tpl); return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][wd]} ${p && p.tpl === 'rest' ? 'rest' : tp ? tp.name + (p.time ? ' ' + p.time : '') : '-'}`; }).join(', '));
    const ids = [...new Set(sessions.flatMap(x => x.exercises.map(e => e.exId)))].filter(id => !isCardio(id));
    if(ids.length){ out.push('Lifts (last top set, best est. 1RM, change last 4 wks vs prior 4):');
      ids.forEach(id => { const c = strengthChange(id); if(!c) return; const top = c.h[c.h.length - 1].top; out.push(`- ${exById(id).en}: ${top.w} kg x ${top.r}, e1RM ${Math.round(c.best)}${c.pct !== null ? `, ${c.pct > 0 ? '+' : ''}${c.pct.toFixed(1)}%` : ''}`); }); }
    const g = gapDays(); if(g !== null) out.push(`Last workout: ${g} days ago.`);
  }
  if(supps.length){
    out.push('\nMy supplement routine:');
    supps.forEach(s => out.push(`- ${s.qid && QBY[s.qid] ? QBY[s.qid].en : s.name}: ${fmt(s.dose)} ${S['u_' + s.unit][0]}, ${s.times.map(x => S['slot_' + x][0].toLowerCase()).join(' + ')}, ${s.often === 'daily' ? 'every day' : s.often === 'training' ? 'training days' : 'when needed'}${s.notes ? ' — ' + s.notes : ''}`));
  }
  return out.join('\n');
}
$('copyClaude').addEventListener('click', async () => {
  if(!foods.length && !meals.length && !supps.length && !fridge.length){ toast(t('nothingCopy')); return; }
  const txt = claudeText();

  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(t('copied')); }
});

$('importInput').addEventListener('change', async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const inFoods = Array.isArray(data) ? data : data.foods, inMeals = Array.isArray(data.meals) ? data.meals : [];
    if(!Array.isArray(inFoods)) throw new Error();
    let added = 0, updated = 0;
    const merge = (arr, incoming, fix) => { for(const raw of incoming){ if(!raw || !raw.name) continue; const f = fix(raw);
      const i = arr.findIndex(x => x.id === f.id);
      if(i === -1){ arr.push({ ...f, id: f.id || uid() }); added++; } else if((f.updatedAt||'') > (arr[i].updatedAt||'')){ arr[i] = f; updated++; } } };
    merge(foods, inFoods, migrate); merge(meals, inMeals, m => m); merge(supps, Array.isArray(data.supps) ? data.supps : [], s => s);
    if(data.suppLog && typeof data.suppLog === 'object') for(const [d, v] of Object.entries(data.suppLog)) suppLog[d] = { ...(suppLog[d] || {}), ...v };
    merge(fridge, Array.isArray(data.fridge) ? data.fridge.map(x => ({ ...x, name: x.name || 'item' })) : [], x => x);
    merge(groc, Array.isArray(data.groc) ? data.groc : [], x => x);
    if(data.dayLog && typeof data.dayLog === 'object') for(const [d, v] of Object.entries(data.dayLog)){ const have = new Set((dayLog[d] || []).map(e => e.id)); dayLog[d] = (dayLog[d] || []).concat((v || []).filter(e => !have.has(e.id))); }
    if(data.days && typeof data.days === 'object') days = { ...data.days, ...days };
    if(data.plans && typeof data.plans === 'object') plans = { ...data.plans, ...plans };
    if(data.targets && !targets) targets = data.targets;
    if(data.weights && typeof data.weights === 'object'){ weights = { ...data.weights, ...weights }; store(WKEY, weights); }
    if(data.gym){ const g = data.gym; const have = new Set(sessions.map(x => x.id)); sessions = sessions.concat((g.sessions || []).filter(x => !have.has(x.id))).sort((a, b) => a.start.localeCompare(b.start));
      const ht = new Set(tpls.map(x => x.id)); tpls = tpls.concat((g.tpl || []).filter(x => !ht.has(x.id))); const hc = new Set(exCustom.map(x => x.id)); exCustom = exCustom.concat((g.custom || []).filter(x => !hc.has(x.id)));
      if(g.plan && !Object.keys(gymPlan).length) gymPlan = g.plan; ['ses', 'tpl', 'custom', 'plan'].forEach(saveG); }
    if(data.pet && !pet){ pet = data.pet; saveG('pet'); }
    fridge.forEach(x => { if(x.name === 'item') delete x.name; });
    saveFoods(); saveMeals(); saveSupps(); store(LOGKEY, suppLog); saveFridge(); saveGroc(); saveLog(); saveDays(); store(PLKEY, plans); if(targets) store(TGKEY, targets); renderAll(); toast(t('imported', { a: added, u: updated }));
  }catch(err){ toast(t('badBackup')); }
});
